name: ATPipi
version: 1.0
main: com.example.atpipi.ATPipiPlugin
api-version: 1.20
commands:
  atpipi:
    description: Мочиться на игроков
    usage: /atpipi
    permission: atpipi.use
  atpipi-toggle:
    description: Включить/выключить ATPipi
    usage: /atpipi-toggle
    permission: atpipi.toggle
permissions:
  atpipi.use:
    default: true
  atpipi.toggle:
    default: op
